name: Update Hashes

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  update-hashes:
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Update hashes and push with conflict handling
        run: |
          MAX_ATTEMPTS=5
          RETRY_DELAY=5

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH="$GITHUB_HEAD_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi

          echo "Target branch: $BRANCH"

          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            echo "Fetching latest branch state..."

            git fetch origin "$BRANCH"

            echo "Fetch completed."

            echo "Resetting local state to origin/$BRANCH..."

            git reset --hard "origin/$BRANCH"
            git clean -fd

            echo "Local state reset."

            # Update hash files
            echo "Updating hashes and setups..."

            python update_hashes.py --config hash_config.json

            echo "Hashes and setups update completed."

            # Stage and commit global setup changes if any
            git add "*.rsc"
            if ! git diff --cached --quiet; then
              echo "Creating commit for global setup..."
              git commit -m "update global setup"
            else
              echo "No changes in global setup."
            fi

            # Stage and commit script hash changes if any
            git add "*.txt"
            if ! git diff --cached --quiet; then
              echo "Creating commit for script hashes..."
              git commit -m "update script hashes"
            else
              echo "No changes in hashes."
            fi

            # Check if there is anything to push at all
            if git diff --quiet origin/"$BRANCH" HEAD; then
              echo "No changes to push. Done."
              exit 0
            fi

            # Update last commit hashes
            echo "Updating last commit hashes..."

            python update_hashes.py --config hash_config.json

            echo "Last commit hashes update completed."

            # Stage and commit hash changes if any
            git add "*.txt"
            if ! git diff --cached --quiet; then
              echo "Creating commit for last commit hashes..."
              git commit -m "update last commit hashes"
            else
              echo "No changes in last commit hashes."
            fi

            echo "Pushing changes..."
            if git push origin HEAD:"$BRANCH"; then
              echo "Successfully pushed updates."
              exit 0
            else
              echo "Push failed. Retrying..."
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep "$RETRY_DELAY"
          done

          echo "Error: Max attempts reached for updating repository."
          exit 1
