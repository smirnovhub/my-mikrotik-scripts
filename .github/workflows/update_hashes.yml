name: Update Hashes

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  update-hashes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Update hashes and push with conflict handling
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH="$GITHUB_HEAD_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi

          MAX_ATTEMPTS=5
          RETRY_DELAY=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            # Reset everything to the current remote branch state
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            # Re-run hash update script on the latest version of files
            python update_hashes.py -a md5 global/list.txt
            python update_hashes.py -a md5 global/tests/list.txt
            python update_hashes.py -a md5 other/list.txt
            
            python update_hashes.py -a crc32 global/tests/test_data/test_list_crc32.txt
            python update_hashes.py -a md5 global/tests/test_data/test_list_md5.txt
            python update_hashes.py -a sha1 global/tests/test_data/test_list_sha1.txt
            python update_hashes.py -a sha256 global/tests/test_data/test_list_sha256.txt
            python update_hashes.py -a md5 global/tests/test_data/auto_update_test_list.txt

            # Check for any uncommitted changes
            git add "*.txt"
            
            if git diff --cached --quiet; then
              echo "No changes to commit after updating hashes."
              exit 0
            fi

            # Commit generated changes
            git commit -m "update hashes"

            # Try to push changes; retry loop restarts if a concurrent commit arrives
            if git push origin HEAD:"$BRANCH"; then
              echo "Successfully pushed updated hashes."
              exit 0
            else
              echo "Push failed due to concurrent updates. Retrying..."
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep "$RETRY_DELAY"
          done

          echo "Error: Max attempts reached for updating hashes."
          exit 1
