name: Update Hashes

on:
  push:
    paths:
      - '**/*.rsc'
      - '**/*.txt'
      - '**/*.py'
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run hash update script for list files
        run: |
          python update_hashes.py list.txt
          python update_hashes.py global/list.txt

      - name: Commit and push changes
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add list.txt global/list.txt
            
            # Commit only if there are uncommitted changes
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "update hashes"
            fi
            
            if [ -n "$GITHUB_HEAD_REF" ]; then
              BRANCH="$GITHUB_HEAD_REF"
            else
              BRANCH="$GITHUB_REF_NAME"
            fi
            
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
