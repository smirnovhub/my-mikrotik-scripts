name: Update Hashes

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  update-hashes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Update hashes and push with conflict handling
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH="$GITHUB_HEAD_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi

          echo "Target branch: $BRANCH"

          MAX_ATTEMPTS=3
          RETRY_DELAY=5
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            echo "Fetching latest branch state..."

            git fetch origin "$BRANCH"

            echo "Fetch completed."

            echo "Resetting local state to origin/$BRANCH..."

            git reset --hard "origin/$BRANCH"
            git clean -fd

            echo "Local state reset."

            echo "Updating hashes..."

            python update_hashes.py -a md5 global/list.txt
            python update_hashes.py -a md5 global/tests/list.txt
            python update_hashes.py -a md5 other/list.txt
            
            python update_hashes.py -a crc32 global/tests/test_data/test_list_crc32.txt
            python update_hashes.py -a md5 global/tests/test_data/test_list_md5.txt
            python update_hashes.py -a sha1 global/tests/test_data/test_list_sha1.txt
            python update_hashes.py -a sha256 global/tests/test_data/test_list_sha256.txt
            python update_hashes.py -a md5 global/tests/test_data/auto_update_test_list.txt

            echo "Hash update completed."

            echo "Staging changes..."

            git add "*.txt"

            if git diff --cached --quiet; then
              echo "No changes to commit. Done."
              exit 0
            fi

            echo "Changes detected. Creating commit..."

            git commit -m "update hashes"

            echo "Commit created."

            echo "Pushing changes..."

            if git push origin HEAD:"$BRANCH"; then
              echo "Successfully pushed updated hashes."
              exit 0
            else
              echo "Push failed. Retrying..."
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep "$RETRY_DELAY"
          done

          echo "Error: Max attempts reached for updating hashes."
          exit 1
