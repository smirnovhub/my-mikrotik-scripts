name: Update Hashes

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  update-hashes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run hash update script for list files
        run: |
          python update_hashes.py -a md5 global/list.txt
          python update_hashes.py -a md5 global/tests/list.txt
          python update_hashes.py -a md5 other/list.txt
          
          python update_hashes.py -a crc32 global/tests/test_data/test_list_crc32.txt
          python update_hashes.py -a md5 global/tests/test_data/test_list_md5.txt
          python update_hashes.py -a sha1 global/tests/test_data/test_list_sha1.txt

      - name: Commit and push changes
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add "*.txt"
            
            # Commit only if there are uncommitted changes
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "update hashes"
            fi
            
            if [ -n "$GITHUB_HEAD_REF" ]; then
              BRANCH="$GITHUB_HEAD_REF"
            else
              BRANCH="$GITHUB_REF_NAME"
            fi
            
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
